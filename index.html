<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informe de erosión hídrica · Subcuenca del Río Carapá</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root { --acento: #13795b; --texto: #1f2933; --suave: #66707d; --borde: #dde2e7; --fondo: #f4f6f8; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--texto); background: var(--fondo); }
  header { background: #fff; border-bottom: 1px solid var(--borde); padding: 16px 20px; }
  header small { color: var(--acento); font-weight: bold; letter-spacing: .04em; }
  header h1 { margin: 4px 0 2px; font-size: 20px; }
  header p { margin: 0; color: var(--suave); font-size: 13px; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  .barra { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 16px; }
  button { font: inherit; padding: 10px 16px; border-radius: 6px; border: 1px solid var(--acento); cursor: pointer; }
  button.primario { background: var(--acento); color: #fff; }
  button.secundario { background: #fff; color: var(--acento); }
  button:disabled { opacity: .5; cursor: wait; }
  .tarjeta { background: #fff; border: 1px solid var(--borde); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
  h2 { font-size: 14px; color: var(--suave); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 8px; }
  h3 { font-size: 14px; color: var(--acento); margin: 12px 0 4px; }
  p, li { font-size: 14px; line-height: 1.45; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { border-bottom: 1px solid var(--borde); padding: 5px 6px; text-align: left; }
  th { color: var(--suave); font-weight: normal; width: 45%; }
  .mapas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mapas figure { margin: 0; }
  .mapas img { width: 100%; border: 1px solid var(--borde); border-radius: 4px; background: #eee; }
  figcaption { font-size: 12px; color: var(--suave); margin-top: 4px; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; margin-top: 8px; }
  .leyenda span i { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: -2px; border: 1px solid #999; }
  .gradiente { height: 12px; border: 1px solid #999; width: 220px; }
  .serie { display: flex; align-items: flex-end; gap: 10px; height: 120px; padding-top: 8px; }
  .serie div { flex: 1; text-align: center; font-size: 11px; color: var(--suave); }
  .serie b { display: block; background: var(--acento); border-radius: 3px 3px 0 0; margin: 0 auto 4px; width: 70%; }
  .error { color: #b42318; }
  .nota { font-size: 12px; color: var(--suave); }
  @media (max-width: 640px) { .mapas { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <small>INFORME DE EROSIÓN HÍDRICA DEL SUELO</small>
  <h1>Subcuenca del Río Carapá</h1>
  <p>Canindeyú, Paraguay · Modelo RUSLE · Visor geoespacial (Acosta Ríos, 2026)</p>
</header>
<main>
  <div class="barra">
    <button id="btnPdf" class="primario" disabled>Preparando el informe…</button>
    <button id="btnVisor" class="secundario">Volver al visor</button>
  </div>
  <div id="contenido"></div>
</main>
<script>
var VISOR = 'https://erosion-hidrica-tesis.projects.earthengine.app/view/yvy-syry';
var SEMAFORO = ['#1a9641', '#f2d600', '#fd8d3c', '#d7191c'];
var CLASES = ['Ligero (< 5)', 'Moderado (5 - 11)', 'Severo (11 - 25)', 'Muy severo o crítico (>= 25)'];
var ANIOS = ['2021', '2022', '2023', '2024', '2025'];
var D = null, IMG = {};

// ---- utilidades ---------------------------------------------------------------------------
function num(x, d) {
  if (x === null || x === undefined || isNaN(x)) return '-';
  var p = Number(x).toFixed(d).split('.');
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return p.join(',');
}
// Caracteres compatibles con la fuente estándar del PDF
function limpio(s) {
  return String(s === undefined || s === null ? '' : s).replace(/≥/g, '>=').replace(/≤/g, '<=').replace(/[–—−]/g, '-')
    .replace(/[⁻¹]/g, '').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/…/g, '...').replace(/📍|📄|⬇/g, '');
}
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }

// WGS 84 → UTM (zona 21 S por defecto)
function utm(lat, lon) {
  var a = 6378137, f = 1 / 298.257223563, k0 = 0.9996, e2 = f * (2 - f), ep2 = e2 / (1 - e2);
  var zona = Math.floor((lon + 180) / 6) + 1, lon0 = ((zona - 1) * 6 - 180 + 3) * Math.PI / 180;
  var fi = lat * Math.PI / 180, la = lon * Math.PI / 180;
  var N = a / Math.sqrt(1 - e2 * Math.sin(fi) * Math.sin(fi)), T = Math.tan(fi) * Math.tan(fi);
  var C = ep2 * Math.cos(fi) * Math.cos(fi), A = Math.cos(fi) * (la - lon0);
  var M = a * ((1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 * e2 * e2 / 256) * fi - (3 * e2 / 8 + 3 * e2 * e2 / 32 + 45 * e2 * e2 * e2 / 1024) * Math.sin(2 * fi)
      + (15 * e2 * e2 / 256 + 45 * e2 * e2 * e2 / 1024) * Math.sin(4 * fi) - (35 * e2 * e2 * e2 / 3072) * Math.sin(6 * fi));
  var x = k0 * N * (A + (1 - T + C) * Math.pow(A, 3) / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * Math.pow(A, 5) / 120) + 500000;
  var y = k0 * (M + N * Math.tan(fi) * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * Math.pow(A, 4) / 24
      + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * Math.pow(A, 6) / 720));
  if (lat < 0) y += 10000000;
  return {x: x, y: y, zona: zona + (lat < 0 ? 'S' : 'N')};
}

function imagenComoDatos(url) {
  return fetch(url, {mode: 'cors'}).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob();
  }).then(function (b) {
    return new Promise(function (res) {
      var fr = new FileReader(); fr.onload = function () {
        var im = new Image(); im.onload = function () { res({datos: fr.result, w: im.width, h: im.height}); };
        im.src = fr.result;
      }; fr.readAsDataURL(b);
    });
  });
}

// ---- lectura de los datos enviados por el visor ---------------------------------------------
function leerDatos() {
  var q = new URLSearchParams(location.search).get('d');
  if (!q) return null;
  try { return JSON.parse(q); } catch (e) { return null; }
}

function titulo() {
  if (D.tipo === 'punto') return 'Consulta por punto';
  if (D.tipo === 'micro') return 'Microcuenca n.º ' + D.micro.rango + ' de ' + D.micro.total + ' (ranking de prioridad)';
  return 'Área dibujada por el usuario';
}
function periodoTexto() { return D.periodo === 'media' ? 'Promedio 2021-2025' : 'Año ' + D.periodo; }

function filasResultados() {
  var f = [];
  f.push(['Erosión hídrica real', num(D.A, 2) + ' t/ha/año']);
  f.push(['Equivalencia', num(D.A / 10, 2) + ' kg/m² por año · ' + num(D.A / (10 * (D.BD || 1.3)), 2) + ' mm de suelo por año']);
  if (D.haTot) f.push(['Superficie dentro de la subcuenca', num(D.haTot, 1) + ' ha']);
  if (D.ha) f.push(['Superficie con datos de erosión', num(D.ha, 1) + ' ha' + (D.haTot ? ' (sin cuerpos de agua ni píxeles sin dato)' : '')]);
  if (D.ha) f.push(['Pérdida total de suelo', num(D.A * D.ha, 0) + ' t/año']);
  f.push(['Clase de severidad', CLASES[D.clase]]);
  if (D.sobre !== undefined) f.push(['Superficie sobre 11 t/ha/año', num(D.sobre, 1) + ' %']);
  f.push(['Erosión hídrica potencial (suelo desnudo)', num(D.Apot, 1) + ' t/ha/año']);
  f.push(['Uso del suelo principal (MapBiomas Paraguay)', D.uso]);
  f.push(['Factor R (erosividad)', num(D.R, 0) + ' MJ·mm/ha·h·año']);
  f.push(['Factor K (erodabilidad)', num(D.K, 4)]);
  f.push(['Factor LS (topografía) · pendiente', num(D.LS, 2) + ' · ' + num(D.pend, 1) + ' %']);
  f.push(['Factor C (cobertura) · Factor P', num(D.C, 3) + ' · 1']);
  return f;
}

function coordenadasTexto() {
  var u = utm(D.lat, D.lon), t = [];
  var pre = D.tipo === 'punto' ? '' : 'Centroide - ';
  t.push([pre + 'Latitud, longitud (WGS 84)', num(D.lat, 5) + ', ' + num(D.lon, 5)]);
  t.push([pre + 'UTM zona ' + u.zona + ' (E, N)', num(u.x, 0) + ' m E, ' + num(u.y, 0) + ' m N']);
  return t;
}

// ---- vista en la página ---------------------------------------------------------------------
function tabla(filas) {
  return '<table>' + filas.map(function (f) { return '<tr><th>' + esc(f[0]) + '</th><td>' + esc(f[1]) + '</td></tr>'; }).join('') + '</table>';
}
function leyendaHtml() {
  if (D.leyenda.clase) return '<div class="leyenda">' + CLASES.map(function (c, i) {
    return '<span><i style="background:' + SEMAFORO[i] + '"></i>' + esc(c) + ' t/ha/año</span>'; }).join('') + '</div>';
  return '<div class="leyenda"><span>' + esc(num(D.leyenda.min, D.leyenda.min < 1 && D.leyenda.min > 0 ? 3 : 0)) + '</span>' +
    '<div class="gradiente" style="background:linear-gradient(90deg,' + D.leyenda.paleta.map(function (c) { return '#' + c; }).join(',') + ')"></div>' +
    '<span>' + esc(num(D.leyenda.max, D.leyenda.max < 1 ? 4 : 0) + ' ' + D.leyenda.unidad) + '</span></div>';
}

function mostrar() {
  var max = Math.max.apply(null, D.serie.map(function (v) { return v || 0; })) || 1, h = [];
  h.push('<div class="tarjeta"><h2>' + esc(titulo()) + '</h2><p><b>Periodo:</b> ' + esc(periodoTexto()) +
         ' · <b>Capa del mapa:</b> ' + esc(D.capa) + ' · <b>Fecha del informe:</b> ' + esc(D.fecha) + '</p></div>');
  h.push('<div class="tarjeta"><h2>Mapas</h2><div class="mapas">' +
    '<figure><img src="' + esc(D.mapas.detalle) + '" alt="Mapa de detalle"><figcaption>Figura 1. Detalle del ' +
    (D.tipo === 'punto' ? 'lugar consultado (círculo celeste)' : (D.tipo === 'micro' ? 'microcuenca' : 'área dibujada') + ' (en azul)') +
    '. Fondo: relieve SRTM.</figcaption></figure>' +
    '<figure><img src="' + esc(D.mapas.ubicacion) + '" alt="Mapa de ubicación"><figcaption>Figura 2. Ubicación en la subcuenca del Río Carapá.</figcaption></figure>' +
    '</div>' + leyendaHtml() + '</div>');
  h.push('<div class="tarjeta"><h2>Ubicación y coordenadas</h2>' + tabla(coordenadasTexto()) +
    (D.vertices && D.vertices.length ? '<h3>Vértices (latitud, longitud)</h3><p class="nota">' +
      D.vertices.map(function (v, i) { return (i + 1) + ') ' + num(v[1], 5) + ', ' + num(v[0], 5); }).join(' · ') + '</p>' : '') + '</div>');
  h.push('<div class="tarjeta"><h2>Resultados</h2>' + tabla(filasResultados()) +
    (D.clases ? '<h3>Superficie por clase de severidad</h3>' + tabla(CLASES.map(function (c, i) {
      return [c + ' t/ha/año', num(D.clases[i], 1) + ' ha (' + num(100 * D.clases[i] / D.clases.reduce(function (s, v) { return s + v; }, 0), 1) + ' %)']; })) : '') +
    '<h3>Erosión real por año (t/ha/año)</h3><div class="serie">' + D.serie.map(function (v, i) {
      return '<div><b style="height:' + Math.max(2, 90 * (v || 0) / max) + 'px"></b>' + num(v, 1) + '<br>' + ANIOS[i] + '</div>'; }).join('') + '</div></div>');
  h.push('<div class="tarjeta"><h2>Explicación</h2>' + D.explicacion.map(function (s) {
    return '<h3>' + esc(s[0]) + '</h3>' + s[1].map(function (p) { return '<p>' + esc(p) + '</p>'; }).join(''); }).join('') + '</div>');
  if (D.sim) h.push('<div class="tarjeta"><h2>Simulador de manejo</h2>' + tabla(filasSim()) + '</div>');
  h.push('<div class="tarjeta"><h2>Recomendaciones de manejo</h2><ul>' + D.recomendaciones.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>' +
    '<p class="nota">Orientación general basada en el modelo RUSLE y datos satelitales. Para decisiones en una parcela concreta, consulte a un técnico.</p></div>');
  h.push('<div class="tarjeta"><h2>Método y fuentes</h2><p class="nota">' + esc(METODO) + '</p></div>');
  document.getElementById('contenido').innerHTML = h.join('');
}

function filasSim() {
  var s = D.sim, elegidas = [];
  if (s.cob) elegidas.push('Cobertura permanente del suelo'); if (s.curvas) elegidas.push('Cultivo en curvas de nivel');
  if (s.terrazas) elegidas.push('Terrazas con canales empastados');
  var f = [['Prácticas simuladas', elegidas.length ? elegidas.join('; ') : 'Ninguna práctica marcada'],
           ['Erosión actual', num(D.A, 1) + ' t/ha/año'], ['Erosión con las prácticas', num(s.nuevo, 1) + ' t/ha/año (' + CLASES[s.clase] + ')'],
           ['Reducción', num(s.red, 0) + ' %']];
  if (D.ha) f.push(['Suelo que se evitaría perder', num((D.A - s.nuevo) * D.ha, 0) + ' t/año']);
  return f;
}

var METODO = 'Pérdida de suelo estimada con la Ecuación Universal de Pérdida de Suelo Revisada (RUSLE): A = R · K · LS · C · P (Renard et al., 1997). ' +
  'R a partir de CHIRPS v3 (Lombardi Neto y Moldenhauer, 1992); K con SoilGrids 2.0 y la ecuación EPIC (Williams, 1995); LS con SRTM de 30 m ' +
  '(Moore y Burch, 1986); C con NDVI de Landsat 8 y 9 (Van der Knijff et al., 2000); P = 1. Severidad según Bertoni y Lombardi Neto (2010). ' +
  'Uso del suelo: MapBiomas Paraguay, colección 3. Simulación: cobertura con C = 0,05 y factor P de Wischmeier y Smith (1978). ' +
  'Fuente: visor geoespacial de erosión hídrica de la subcuenca del Río Carapá, tesis de grado de Ramona Belén Acosta Ríos, ' +
  'Ingeniería Ambiental, Facultad de Ingeniería Agronómica, Universidad Nacional del Este (2026).';

// ---- PDF ---------------------------------------------------------------------------------------
function generarPdf() {
  var jsPDF = window.jspdf.jsPDF, doc = new jsPDF({unit: 'mm', format: 'a4'});
  var M = 15, W = 210 - 2 * M, y = M, pagina = 1;
  function nueva() { pie(); doc.addPage(); pagina++; y = M; }
  function espacio(h) { if (y + h > 280) nueva(); }
  function pie() {
    doc.setFontSize(8); doc.setTextColor(110);
    doc.text(limpio('Informe generado con el visor de erosión hídrica de la subcuenca del Río Carapá · ' + D.fecha), M, 290);
    doc.text('Página ' + pagina, 210 - M, 290, {align: 'right'}); doc.setTextColor(0);
  }
  function texto(t, tam, estilo, color, sangria) {
    doc.setFont('helvetica', estilo || 'normal'); doc.setFontSize(tam || 10); doc.setTextColor.apply(doc, color || [31, 41, 51]);
    var lineas = doc.splitTextToSize(limpio(t), W - (sangria || 0));
    lineas.forEach(function (l) { espacio(tam * 0.45); doc.text(l, M + (sangria || 0), y); y += tam * 0.45; });
    y += 1.2; doc.setTextColor(0);
  }
  function seccion(t) { espacio(12); y += 3; doc.setFillColor(19, 121, 91); doc.rect(M, y - 4, 2, 5.5, 'F'); texto(t.toUpperCase(), 11, 'bold', [19, 121, 91], 4); y += 1; }
  function filas(f) {
    f.forEach(function (r) {
      var izq = doc.splitTextToSize(limpio(r[0]), W * 0.45), der = doc.splitTextToSize(limpio(r[1]), W * 0.53);
      var h = Math.max(izq.length, der.length) * 4.4 + 1.6; espacio(h);
      doc.setFontSize(9.5); doc.setFont('helvetica', 'normal'); doc.setTextColor(102, 112, 125); doc.text(izq, M, y);
      doc.setTextColor(31, 41, 51); doc.text(der, M + W * 0.47, y);
      doc.setDrawColor(221, 226, 231); doc.line(M, y + h - 3.6, M + W, y + h - 3.6); y += h;
    });
    y += 1; doc.setTextColor(0);
  }
  // Encabezado
  doc.setFillColor(19, 121, 91); doc.rect(0, 0, 210, 26, 'F');
  doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
  doc.text(limpio('Informe de erosión hídrica del suelo'), M, 11);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  doc.text(limpio('Subcuenca del Río Carapá, Canindeyú, Paraguay · Modelo RUSLE'), M, 17.5);
  doc.text(limpio(titulo() + ' · ' + periodoTexto() + ' · ' + D.fecha), M, 22.5);
  doc.setTextColor(0); y = 34;
  // Mapas
  seccion('Mapas');
  var anchoMapa = (W - 6) / 2, hMax = 0;
  [['detalle', 'Figura 1. Detalle del ' + (D.tipo === 'punto' ? 'lugar consultado' : D.tipo === 'micro' ? 'área de la microcuenca' : 'área dibujada')],
   ['ubicacion', 'Figura 2. Ubicación en la subcuenca']].forEach(function (m, i) {
    var im = IMG[m[0]]; if (!im) return;
    var h = anchoMapa * im.h / im.w; hMax = Math.max(hMax, h);
    doc.addImage(im.datos, 'PNG', M + i * (anchoMapa + 6), y, anchoMapa, h);
    doc.setDrawColor(180); doc.rect(M + i * (anchoMapa + 6), y, anchoMapa, h);
    doc.setFontSize(8.5); doc.setTextColor(102, 112, 125); doc.text(limpio(m[1]), M + i * (anchoMapa + 6), y + h + 4);
  });
  y += hMax + 8; doc.setTextColor(0);
  // Leyenda
  doc.setFontSize(8.5); doc.setFont('helvetica', 'bold'); doc.text(limpio(D.capa + ' (' + periodoTexto() + ')'), M, y); y += 4;
  doc.setFont('helvetica', 'normal');
  if (D.leyenda.clase) {
    var x = M; CLASES.forEach(function (c, i) {
      var rgb = SEMAFORO[i].match(/\w\w/g).map(function (h) { return parseInt(h, 16); });
      doc.setFillColor(rgb[0], rgb[1], rgb[2]); doc.rect(x, y - 3, 4, 4, 'F'); doc.text(limpio(c), x + 5.5, y); x += doc.getTextWidth(limpio(c)) + 11;
    }); y += 2;
  } else {
    var pal = D.leyenda.paleta, ancho = 60;
    for (var k = 0; k < 60; k++) {
      var tt = k / 59 * (pal.length - 1), i0 = Math.floor(tt), i1 = Math.min(pal.length - 1, i0 + 1), fr = tt - i0;
      var c0 = pal[i0].match(/\w\w/g).map(function (h) { return parseInt(h, 16); }), c1 = pal[i1].match(/\w\w/g).map(function (h) { return parseInt(h, 16); });
      doc.setFillColor(c0[0] + (c1[0] - c0[0]) * fr, c0[1] + (c1[1] - c0[1]) * fr, c0[2] + (c1[2] - c0[2]) * fr);
      doc.rect(M + k * ancho / 60, y - 3, ancho / 60 + 0.2, 4, 'F');
    }
    doc.text(limpio(num(D.leyenda.min, D.leyenda.min < 1 && D.leyenda.min > 0 ? 3 : 0)), M, y + 4.5);
    doc.text(limpio(num(D.leyenda.max, D.leyenda.max < 1 ? 4 : 0) + ' ' + D.leyenda.unidad), M + ancho, y + 4.5, {align: 'right'}); y += 6;
  }
  y += 4;
  texto('Contorno negro: subcuenca del Río Carapá. ' + (D.tipo === 'punto' ? 'Celeste: lugar consultado.' : 'Azul: área analizada.') +
        ' Proyección Web Mercator; fondo de relieve SRTM.', 8.5, 'normal', [102, 112, 125]);
  // Coordenadas
  seccion('Ubicación y coordenadas'); filas(coordenadasTexto());
  if (D.vertices && D.vertices.length) {
    texto('Vértices del polígono (latitud, longitud): ' + D.vertices.map(function (v, i) { return (i + 1) + ') ' + num(v[1], 5) + ', ' + num(v[0], 5); }).join('; '),
          8.5, 'normal', [70, 80, 90]);
  }
  // Resultados
  seccion('Resultados'); filas(filasResultados());
  if (D.clases) {
    var tot = D.clases.reduce(function (s, v) { return s + v; }, 0);
    filas(CLASES.map(function (c, i) { return [c + ' t/ha/año', num(D.clases[i], 1) + ' ha (' + num(100 * D.clases[i] / tot, 1) + ' %)']; }));
  }
  // Serie
  espacio(40); texto('Erosión real por año (t/ha/año)', 9.5, 'bold');
  var mx = Math.max.apply(null, D.serie.map(function (v) { return v || 0; })) || 1, base = y + 26;
  D.serie.forEach(function (v, i) {
    var paso = Math.min(30, 150 / D.serie.length), h = 24 * (v || 0) / mx, x0 = M + 8 + i * paso;
    doc.setFillColor(19, 121, 91); doc.rect(x0, base - h, Math.min(16, paso - 4), h, 'F');
    doc.setFontSize(8.5); doc.text(limpio(num(v, 1)), x0 + 8, base - h - 1.5, {align: 'center'}); doc.text(ANIOS[i], x0 + 8, base + 4, {align: 'center'});
  });
  y = base + 9;
  // Explicación
  seccion('Explicación');
  D.explicacion.forEach(function (s) { texto(s[0], 10, 'bold', [19, 121, 91]); s[1].forEach(function (p) { texto(p, 9.5); }); });
  if (D.sim) { seccion('Simulador de manejo'); filas(filasSim()); }
  seccion('Recomendaciones de manejo');
  D.recomendaciones.forEach(function (r) { texto('- ' + r, 9.5, 'normal', null, 2); });
  texto('Orientación general basada en el modelo RUSLE y datos satelitales. Para decisiones en una parcela concreta, consulte a un técnico.', 8.5, 'italic', [102, 112, 125]);
  seccion('Método y fuentes'); texto(METODO, 8.5, 'normal', [70, 80, 90]);
  texto('Visor: ' + VISOR, 8.5, 'normal', [19, 121, 91]);
  pie();
  doc.save('informe_erosion_' + D.tipo + '_' + D.fecha + '.pdf');
}

// ---- inicio --------------------------------------------------------------------------------------
document.getElementById('btnVisor').onclick = function () { location.href = D && D.enlace ? D.enlace : VISOR; };
D = leerDatos(); if (D && D.anios) ANIOS = D.anios;
var boton = document.getElementById('btnPdf');
if (!D) {
  document.getElementById('contenido').innerHTML = '<div class="tarjeta"><p class="error">No se recibieron datos. Abra el informe desde el botón «Generar informe PDF» del visor.</p></div>';
  boton.textContent = 'Sin datos';
} else {
  mostrar();
  Promise.all(['detalle', 'ubicacion'].map(function (k) {
    return imagenComoDatos(D.mapas[k]).then(function (r) { IMG[k] = r; }).catch(function () { IMG[k] = null; });
  })).then(function () {
    boton.disabled = false; boton.textContent = 'Descargar PDF';
    if (!IMG.detalle || !IMG.ubicacion) boton.textContent = 'Descargar PDF (algún mapa no cargó)';
  });
  boton.onclick = function () { boton.disabled = true; try { generarPdf(); } finally { boton.disabled = false; } };
}
</script>
</body>
